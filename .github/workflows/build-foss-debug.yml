name: Build foss debug

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Кеширует ~/.gradle (зависимости, wrapper, результаты задач) и сохраняет его между запусками
      - uses: gradle/actions/setup-gradle@v4

      - name: Create secrets.properties
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' \
            "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" > secrets.properties

      - name: Build
        run: ./gradlew :app:assembleFossDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pingogram-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
